<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#040306" />
<title>EVENT HORIZON — Aether Labs</title>
<meta name="description" content="A realtime screen-space black hole with gravitational lensing, accretion disk and photon ring. WebGL2 / Three.js." />
<style>
  :root{
    --accent:#ffae5c;
    --accent2:#ff6b9d;
    --text:#f3e9df;
    --dim:#9b8677;
    --line:rgba(255,174,92,.2);
    --mono:"SF Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#040306}
  body{font-family:var(--mono);color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;touch-action:none;cursor:crosshair}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .topnav{position:absolute;top:26px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .brand{display:flex;align-items:center;gap:13px}
  .mark{width:34px;height:34px;flex:0 0 34px;border:1px solid rgba(255,174,92,.5);display:grid;place-items:center;transform:rotate(45deg);color:var(--accent);font-size:15px;background:rgba(30,18,10,.5);box-shadow:0 0 28px rgba(255,150,60,.25),inset 0 0 14px rgba(255,150,60,.12)}
  .mark span{display:block;transform:rotate(-45deg)}
  .brand h1{font-size:13px;letter-spacing:.3em;font-weight:600;color:#fff1e4}
  .brand p{margin-top:5px;font-size:7.5px;letter-spacing:.28em;color:var(--dim)}
  .nav-right{display:flex;align-items:center;gap:14px}
  .stats{display:flex;align-items:center;gap:9px;font-size:8px;letter-spacing:.18em;color:var(--dim);border:1px solid var(--line);padding:8px 11px;background:rgba(14,9,6,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .stats b{color:var(--accent);font-weight:400;font-variant-numeric:tabular-nums}
  .stats .sep{width:1px;height:9px;background:rgba(255,174,92,.2)}
  .backlink{pointer-events:auto;text-decoration:none;color:var(--dim);font-size:8px;letter-spacing:.22em;border:1px solid var(--line);padding:8px 11px;background:rgba(14,9,6,.4);transition:color .2s,border-color .2s}
  .backlink:hover{color:var(--accent);border-color:rgba(255,174,92,.55)}

  .hint{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);font-size:8px;letter-spacing:.3em;color:rgba(220,190,170,.6);white-space:nowrap;text-shadow:0 1px 12px rgba(0,0,0,.9)}
  .hint span{color:rgba(255,174,92,.75)}

  .dock{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:min(580px,calc(100% - 36px));display:flex;align-items:center;gap:20px;padding:15px 18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(24,14,9,.66),rgba(8,5,4,.55));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 22px 60px rgba(0,0,0,.55);pointer-events:auto}
  .slider-wrap{flex:1;min-width:0}
  .slider-top{display:flex;justify-content:space-between;align-items:baseline;font-size:8px;letter-spacing:.26em;color:var(--dim);margin-bottom:9px}
  .slider-top b{font-weight:400;color:var(--accent);font-size:10px;letter-spacing:.14em;text-shadow:0 0 12px rgba(255,150,60,.45)}
  input.slider{-webkit-appearance:none;appearance:none;display:block;width:100%;height:16px;background:transparent;cursor:ew-resize;touch-action:none}
  input.slider::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,rgba(255,174,92,.18),rgba(255,174,92,.6) 55%,rgba(255,107,157,.75))}
  input.slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:#fff2e2;border:1px solid #fff;box-shadow:0 0 16px 3px rgba(255,160,70,.65),0 0 28px 6px rgba(255,90,140,.25)}
  input.slider::-moz-range-track{height:2px;background:linear-gradient(90deg,rgba(255,174,92,.2),rgba(255,107,157,.75))}
  input.slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff2e2;border:1px solid #fff}
  .readout{flex:0 0 auto;text-align:right}
  .readout .k{font-size:7px;letter-spacing:.22em;color:var(--dim)}
  .readout .v{font-size:16px;letter-spacing:.06em;color:var(--accent);margin-top:4px;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(255,150,60,.45)}

  .scan{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:.13;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
  .vig{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(120% 90% at 50% 50%,transparent 52%,rgba(0,0,0,.6) 100%)}

  #loader{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(700px 500px at 50% 48%,#110a06,#040306 65%,#020102);transition:opacity .9s ease,visibility .9s}
  #loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .loader-inner{text-align:center;width:min(380px,76vw)}
  .loader-ring{width:62px;height:62px;margin:0 auto 26px;border-radius:50%;border:1px solid rgba(255,174,92,.2);border-top-color:var(--accent);border-right-color:rgba(255,107,157,.7);box-shadow:0 0 40px rgba(255,140,50,.22);animation:spin 1.4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-title{font-size:9px;letter-spacing:.4em;color:#ffe9d4;margin-bottom:16px}
  .loader-bar{height:1px;background:rgba(255,174,92,.15);overflow:hidden}
  .loader-bar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1.3s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(380%)}}
  .loader-meta{display:flex;justify-content:space-between;margin-top:12px;font-size:8px;letter-spacing:.24em;color:var(--dim)}

  @media (max-width:700px){
    .topnav{top:18px;left:18px;right:18px}
    .stats{display:none}
    .brand h1{font-size:11px}
    .dock{bottom:16px;gap:14px;padding:13px 14px}
    .hint{bottom:108px;font-size:7px}
    .readout .v{font-size:14px}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Black hole gravitational lensing"></canvas>

<div class="hud">
  <header class="topnav">
    <div class="brand">
      <div class="mark"><span>◎</span></div>
      <div>
        <h1>EVENT HORIZON</h1>
        <p>GRAVITATIONAL LENSING · WEBGL2</p>
      </div>
    </div>
    <div class="nav-right">
      <div class="stats">
        <span><b id="hud-fps">60</b> FPS</span>
        <span class="sep"></span>
        <span>SHADER</span>
        <span class="sep"></span>
        <span id="hud-res">—</span>
      </div>
      <a class="backlink" href="index.html">← INDEX</a>
    </div>
  </header>

  <div class="hint">MOVE TO SHIFT THE SINGULARITY <span>· DRAG MASS</span></div>

  <div class="dock">
    <div class="slider-wrap">
      <div class="slider-top"><span>BLACK HOLE MASS</span><b id="mass-val">060</b></div>
      <input class="slider" id="mass" type="range" min="0" max="100" step="1" value="60" aria-label="Black hole mass" />
    </div>
    <div class="readout">
      <div class="k">SCHWARZSCHILD</div>
      <div class="v" id="mass-read">1.28 M</div>
    </div>
  </div>
</div>

<div class="vig"></div>
<div class="scan"></div>

<div id="loader">
  <div class="loader-inner">
    <div class="loader-ring"></div>
    <div class="loader-title">FORMING EVENT HORIZON</div>
    <div class="loader-bar"><i></i></div>
    <div class="loader-meta"><span>BENDING LIGHT</span><span>∞</span></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
const canvas = $('scene');
const loader = $('loader');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance', stencil: false });
renderer.setClearColor(0x040306, 1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.86;

const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

const uniforms = {
  uRes: { value: new THREE.Vector2(1, 1) },
  uTime: { value: 0 },
  uMass: { value: 1.28 },
  uPointer: { value: new THREE.Vector2(0, 0) },
};

const shader = {
  vertexShader: `
    varying vec2 vUv;
    void main(){
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `,
  fragmentShader: `
    precision highp float;
    varying vec2 vUv;
    uniform vec2 uRes;
    uniform float uTime;
    uniform float uMass;
    uniform vec2 uPointer;

    float hash21(vec2 p){
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float vnoise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      float a = hash21(i);
      float b = hash21(i + vec2(1.0, 0.0));
      float c = hash21(i + vec2(0.0, 1.0));
      float d = hash21(i + vec2(1.0, 1.0));
      return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
    }
    float fbm(vec2 p){
      float s = 0.0, a = 0.5;
      for(int i = 0; i < 5; i++){ s += a * vnoise(p); p *= 2.03; a *= 0.5; }
      return s;
    }

    void main(){
      float aspect = uRes.x / max(uRes.y, 1.0);
      vec2 p = (vUv - 0.5) * vec2(aspect, 1.0);
      p -= uPointer * 0.045;

      float t = uTime;
      float mass = uMass;
      float r = length(p);
      float bh = 0.135 + mass * 0.026;

      // deep space base
      vec3 col = vec3(0.0035, 0.004, 0.009);
      col += vec3(0.09, 0.035, 0.16) * fbm(p * 2.2 + vec2(t * 0.015, 0.0)) * 0.42;

      // lensed starfield: sample direction pushed away from the hole
      vec2 dir = p / max(r, 1e-4);
      float bend = clamp((0.055 + mass * 0.035) / (r * r + 0.008), 0.0, 12.0);
      vec2 sp = p + dir * bend * 0.06;

      float stars = 0.0;
      for(int i = 0; i < 3; i++){
        float scale = 34.0 + float(i) * 52.0;
        vec2 g = sp * scale;
        vec2 cell = floor(g);
        vec2 f = fract(g) - 0.5;
        float h = hash21(cell + float(i) * 71.0);
        float twinkle = 0.55 + 0.45 * sin(t * 1.4 + h * 45.0);
        float s = smoothstep(0.075, 0.0, length(f)) * step(0.968, h);
        stars += s * twinkle * (1.0 - float(i) * 0.24);
        // halo glint on the brightest samples
        stars += smoothstep(0.20, 0.0, length(f)) * step(0.9955, h) * 0.5;
      }
      vec3 starCol = mix(vec3(0.62, 0.78, 1.0), vec3(1.0, 0.85, 0.68), 0.35);
      col += starCol * stars * 1.35;

      // accretion disk (flattened, thin and filamentary)
      float tilt = -0.075;
      vec2 dp = vec2(p.x * cos(tilt) - p.y * sin(tilt), p.x * sin(tilt) + p.y * cos(tilt));
      vec2 q = vec2(dp.x, dp.y * 4.4);
      float dq = length(q);
      float ang = atan(q.y, q.x);
      float n1 = fbm(vec2(ang * 2.4 - t * 0.18, dq * 6.0 - t * 0.3));
      float n2 = fbm(vec2(ang * 6.5 - t * 0.4, dq * 24.0 - t * 0.85));
      float n3 = fbm(vec2(ang * 15.0 - t * 0.6, dq * 62.0 - t * 1.5));
      float filaments = 0.32 + pow(n1, 1.7) * 0.85 + pow(n2, 3.0) * 0.75 + pow(n3, 5.0) * 0.55;
      float diskMask = smoothstep(bh * 1.03, bh * 1.3, dq) * (1.0 - smoothstep(0.30, 0.37, dq));
      float innerGlow = smoothstep(0.42, 0.14, dq);
      float dopp = 1.0 + 0.7 * sin(ang + 1.9) * innerGlow;
      vec3 hot = mix(vec3(1.0, 0.2, 0.03), vec3(1.0, 0.52, 0.16), smoothstep(0.13, 0.34, dq));
      hot = mix(hot, vec3(1.0, 0.38, 0.8), smoothstep(0.28, 0.40, dq) * 0.45);
      float bright = (0.04 + 1.5 * filaments) * diskMask * dopp;
      col += hot * bright * 0.85;

      // lensed far-side arc skimmed over the top of the hole
      float arcR = r / bh;
      float arcBand = smoothstep(1.85, 1.25, arcR) * smoothstep(1.04, 1.16, arcR);
      float arcAbove = smoothstep(-0.1, 0.6, p.y / max(r, 1e-4));
      float arcTex = 0.3 + 0.7 * pow(fbm(vec2(atan(p.y, p.x) * 4.0 - t * 0.3, arcR * 8.0)), 2.0);
      col += vec3(1.0, 0.55, 0.26) * arcBand * arcAbove * arcTex * 0.28;

      // photon ring
      float ring = smoothstep(0.008, 0.0, abs(r - bh * 1.055));
      col += vec3(1.0, 0.7, 0.38) * ring * 1.35;
      float innerRing = smoothstep(0.020, 0.0, abs(r - bh * 1.15));
      col += vec3(1.0, 0.44, 0.18) * innerRing * 0.3;

      // warm halo around the hole
      col += vec3(1.0, 0.46, 0.15) * exp(-abs(r - bh) * 13.0) * 0.16;
      col += vec3(0.32, 0.1, 0.55) * exp(-r * 3.8) * 0.14;

      // event horizon: pure black
      col *= smoothstep(bh * 0.995, bh * 1.02, r);

      // filmic vignette
      float v = length(vUv - 0.5);
      col *= smoothstep(1.25, 0.18, v * 1.7);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
};

const quad = new THREE.Mesh(
  new THREE.PlaneGeometry(2, 2),
  new THREE.ShaderMaterial({ uniforms, vertexShader: shader.vertexShader, fragmentShader: shader.fragmentShader, depthTest: false, depthWrite: false })
);
scene.add(quad);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.3, 0.2, 0.95);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const finalShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uRes: { value: new THREE.Vector2(1, 1) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform vec2 uRes;
    varying vec2 vUv;
    float rand(vec2 c){ return fract(sin(dot(c, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5;
      vec2 off = c * 0.0016 * (0.4 + dot(c, c) * 2.0);
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;
      col += (rand(vUv * uRes + fract(uTime)) - 0.5) * 0.032;
      col *= 1.0 - 0.03 * (0.5 + 0.5 * sin(vUv.y * uRes.y * 1.6));
      gl_FragColor = vec4(col, 1.0);
    }
  `,
};
const finalPass = new ShaderPass(finalShader);
composer.addPass(finalPass);

/* resolution + quality */
const maxDpr = Math.min(window.devicePixelRatio || 1, 1.6);
let dpr = maxDpr;

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(dpr);
  composer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  const buf = new THREE.Vector2();
  renderer.getDrawingBufferSize(buf);
  uniforms.uRes.value.copy(buf);
  finalPass.uniforms.uRes.value.copy(buf);
  const d = $('hud-res');
  if (d) d.textContent = `${w}×${h}`;
}
window.addEventListener('resize', resize);

/* pointer */
const pointer = { tx: 0, ty: 0, x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
  pointer.tx = (e.clientX / window.innerWidth - 0.5) * 2;
  pointer.ty = -(e.clientY / window.innerHeight - 0.5) * 2;
}, { passive: true });

/* slider */
const massEl = $('mass');
const massValEl = $('mass-val');
const massReadEl = $('mass-read');
let targetMass = 1.28;

function applyMass(v) {
  targetMass = 0.55 + (v / 100) * 1.55;
  massValEl.textContent = String(Math.round(v)).padStart(3, '0');
  massReadEl.textContent = targetMass.toFixed(2) + ' M';
}
massEl.addEventListener('input', () => applyMass(Number(massEl.value)));
applyMass(Number(massEl.value));

/* loop */
const clock = new THREE.Clock();
let elapsed = 0;
let fps = 60, frames = 0, acc = 0;

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  pointer.x += (pointer.tx - pointer.x) * Math.min(1, dt * 2.5);
  pointer.y += (pointer.ty - pointer.y) * Math.min(1, dt * 2.5);
  uniforms.uPointer.value.set(pointer.x, pointer.y);

  uniforms.uTime.value = elapsed;
  uniforms.uMass.value += (targetMass - uniforms.uMass.value) * Math.min(1, dt * 3.0);
  finalPass.uniforms.uTime.value = elapsed;

  frames++; acc += dt;
  if (acc >= 0.5) {
    fps = frames / acc;
    $('hud-fps').textContent = fps.toFixed(0);
    $('hud-fps').style.color = fps >= 45 ? '#ffcf9a' : '#ff7b6b';
    frames = 0; acc = 0;
  }

  composer.render();
}

function init() {
  resize();
  renderer.compile(scene, camera);
  composer.render();
  requestAnimationFrame(tick);
  window.setTimeout(() => loader.classList.add('hidden'), 500);
}
init();
</script>
</body>
</html>
