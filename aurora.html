<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#04080b" />
<title>SOLAR VEIL — Aether Labs</title>
<meta name="description" content="A realtime aurora borealis: layered volumetric curtains over a frozen lake, star field and drifting snow. WebGL2." />
<style>
  :root{
    --accent:#6dffc8;
    --accent2:#a78bff;
    --text:#eafff7;
    --dim:#79a89b;
    --line:rgba(109,255,200,.18);
    --mono:"SF Mono","Roboto Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#04080b}
  body{font-family:var(--mono);color:var(--text);-webkit-font-smoothing:antialiased;user-select:none;touch-action:none;cursor:crosshair}
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  .topnav{position:absolute;top:26px;left:30px;right:30px;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
  .brand{display:flex;align-items:center;gap:13px}
  .mark{width:34px;height:34px;flex:0 0 34px;border:1px solid rgba(109,255,200,.5);display:grid;place-items:center;transform:rotate(45deg);color:var(--accent);font-size:15px;background:rgba(6,24,20,.5);box-shadow:0 0 28px rgba(90,255,200,.22),inset 0 0 14px rgba(90,255,200,.1)}
  .mark span{display:block;transform:rotate(-45deg)}
  .brand h1{font-size:13px;letter-spacing:.3em;font-weight:600;color:#ecfff9}
  .brand p{margin-top:5px;font-size:7.5px;letter-spacing:.28em;color:var(--dim)}
  .nav-right{display:flex;align-items:center;gap:14px}
  .stats{display:flex;align-items:center;gap:9px;font-size:8px;letter-spacing:.18em;color:var(--dim);border:1px solid var(--line);padding:8px 11px;background:rgba(4,18,16,.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .stats b{color:var(--accent);font-weight:400;font-variant-numeric:tabular-nums}
  .stats .sep{width:1px;height:9px;background:rgba(109,255,200,.2)}
  .backlink{pointer-events:auto;text-decoration:none;color:var(--dim);font-size:8px;letter-spacing:.22em;border:1px solid var(--line);padding:8px 11px;background:rgba(4,18,16,.4);transition:color .2s,border-color .2s}
  .backlink:hover{color:var(--accent);border-color:rgba(109,255,200,.55)}

  .hint{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);font-size:8px;letter-spacing:.3em;color:rgba(205,245,230,.6);white-space:nowrap;text-shadow:0 1px 14px rgba(0,0,0,.9)}
  .hint span{color:rgba(109,255,200,.85)}

  .dock{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:min(600px,calc(100% - 36px));display:flex;align-items:center;gap:20px;padding:15px 18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(8,28,26,.66),rgba(3,10,10,.55));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 22px 60px rgba(0,0,0,.55);pointer-events:auto}
  .slider-wrap{flex:1;min-width:0}
  .slider-top{display:flex;justify-content:space-between;align-items:baseline;font-size:8px;letter-spacing:.26em;color:var(--dim);margin-bottom:9px}
  .slider-top b{font-weight:400;color:var(--accent);font-size:10px;letter-spacing:.14em;text-shadow:0 0 12px rgba(90,255,200,.55)}
  input.slider{-webkit-appearance:none;appearance:none;display:block;width:100%;height:16px;background:transparent;cursor:ew-resize;touch-action:none}
  input.slider::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,rgba(167,139,255,.25),rgba(109,255,200,.7) 55%,rgba(200,255,170,.85))}
  input.slider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:50%;background:#eafff7;border:1px solid #fff;box-shadow:0 0 16px 3px rgba(90,255,200,.6),0 0 28px 6px rgba(167,139,255,.28)}
  input.slider::-moz-range-track{height:2px;background:linear-gradient(90deg,rgba(167,139,255,.25),rgba(109,255,200,.85))}
  input.slider::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#eafff7;border:1px solid #fff}
  .readout{flex:0 0 auto;text-align:right}
  .readout .k{font-size:7px;letter-spacing:.22em;color:var(--dim)}
  .readout .v{font-size:16px;letter-spacing:.06em;color:var(--accent);margin-top:4px;font-variant-numeric:tabular-nums;text-shadow:0 0 16px rgba(90,255,200,.5)}

  .scan{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:.10;background:repeating-linear-gradient(0deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px)}
  .vig{position:fixed;inset:0;z-index:7;pointer-events:none;background:radial-gradient(125% 95% at 50% 52%,transparent 50%,rgba(0,0,0,.62) 100%)}

  #loader{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:radial-gradient(700px 500px at 50% 48%,#071a18,#04080b 65%,#010303);transition:opacity .9s ease,visibility .9s}
  #loader.hidden{opacity:0;visibility:hidden;pointer-events:none}
  .loader-inner{text-align:center;width:min(380px,76vw)}
  .loader-ring{width:62px;height:62px;margin:0 auto 26px;border-radius:50%;border:1px solid rgba(109,255,200,.22);border-top-color:var(--accent);border-right-color:rgba(167,139,255,.8);box-shadow:0 0 40px rgba(80,255,200,.2);animation:spin 1.2s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loader-title{font-size:9px;letter-spacing:.4em;color:#eafff7;margin-bottom:16px}
  .loader-bar{height:1px;background:rgba(109,255,200,.15);overflow:hidden}
  .loader-bar i{display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,var(--accent),transparent);animation:sweep 1.3s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(380%)}}
  .loader-meta{display:flex;justify-content:space-between;margin-top:12px;font-size:8px;letter-spacing:.24em;color:var(--dim)}

  @media (max-width:700px){
    .topnav{top:18px;left:18px;right:18px}
    .stats{display:none}
    .brand h1{font-size:11px}
    .dock{bottom:16px;gap:14px;padding:13px 14px}
    .hint{bottom:108px;font-size:7px}
    .readout .v{font-size:14px}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Realtime aurora borealis"></canvas>

<div class="hud">
  <header class="topnav">
    <div class="brand">
      <div class="mark"><span>✦</span></div>
      <div>
        <h1>SOLAR VEIL</h1>
        <p>VOLUMETRIC AURORA · WEBGL2</p>
      </div>
    </div>
    <div class="nav-right">
      <div class="stats">
        <span><b id="hud-fps">60</b> FPS</span>
        <span class="sep"></span>
        <span>5 CURTAINS</span>
        <span class="sep"></span>
        <span>FROZEN LAKE</span>
      </div>
      <a class="backlink" href="index.html">← INDEX</a>
    </div>
  </header>

  <div class="hint">MOVE TO LOOK AROUND <span>· SLIDE THE SOLAR WIND</span></div>

  <div class="dock">
    <div class="slider-wrap">
      <div class="slider-top"><span>SOLAR WIND</span><b id="wind-val">060</b></div>
      <input class="slider" id="wind" type="range" min="0" max="100" step="1" value="60" aria-label="Solar wind" />
    </div>
    <div class="readout">
      <div class="k">WIND SPEED</div>
      <div class="v" id="wind-read">620 KM/S</div>
    </div>
  </div>
</div>

<div class="vig"></div>
<div class="scan"></div>

<div id="loader">
  <div class="loader-inner">
    <div class="loader-ring"></div>
    <div class="loader-title">CHARGING THE SOLAR WIND</div>
    <div class="loader-bar"><i></i></div>
    <div class="loader-meta"><span>CHARGED PARTICLES</span><span>KP 6</span></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = (id) => document.getElementById(id);
const canvas = $('scene');
const loader = $('loader');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', stencil: false });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.16;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x04080b, 0.0016);

const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 3000);

/* ------------------------------------------------------------------ sky */
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: { uTime: { value: 0 }, uStorm: { value: 0.6 } },
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main(){
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec3 vDir;
    uniform float uTime;
    uniform float uStorm;

    float hash21(vec2 p){
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float vnoise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x),
                 mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), f.x), f.y);
    }
    float fbm(vec2 p){
      float s = 0.0, a = 0.5;
      for(int i = 0; i < 4; i++){ s += a * vnoise(p); p *= 2.07; a *= 0.5; }
      return s;
    }

    void main(){
      vec3 d = normalize(vDir);
      float h = clamp(d.y, -1.0, 1.0);

      vec3 zenith  = vec3(0.006, 0.014, 0.028);
      vec3 mid     = vec3(0.016, 0.050, 0.062);
      vec3 horizon = vec3(0.020, 0.058, 0.058);
      vec3 col = mix(horizon, mid, smoothstep(0.0, 0.35, h));
      col = mix(col, zenith, smoothstep(0.25, 0.95, h));

      /* faint airglow band above the horizon */
      col += vec3(0.08, 0.45, 0.28) * exp(-abs(h - 0.10) * 16.0) * 0.055 * (0.5 + uStorm);

      /* stars */
      vec2 sp = vec2(atan(d.z, d.x) * 95.0, asin(clamp(d.y, -1.0, 1.0)) * 95.0);
      vec2 cell = floor(sp);
      vec2 f = fract(sp) - 0.5;
      float h1 = hash21(cell);
      float star = smoothstep(0.09, 0.0, length(f)) * step(0.86, h1) * smoothstep(-0.02, 0.22, d.y);
      star *= 0.45 + 0.55 * sin(uTime * 1.4 + h1 * 60.0);
      col += vec3(0.80, 0.90, 1.0) * star * (0.5 + h1 * 0.9);

      /* milky band */
      float band = exp(-pow((d.y - 0.32 - d.x * 0.22) * 5.2, 2.0));
      float dust = fbm(vec2(atan(d.z, d.x) * 7.0, asin(clamp(d.y, -1.0, 1.0)) * 9.0));
      col += vec3(0.26, 0.34, 0.52) * band * (0.05 + dust * 0.09);

      /* horizon haze */
      col += vec3(0.03, 0.08, 0.075) * exp(-abs(h) * 26.0) * 0.55;

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1400, 48, 32), skyMat);
sky.frustumCulled = false;
scene.add(sky);

/* ------------------------------------------------------------- mountains */
function mountainPlane(width, height, dist, seed, tint, rimStrength) {
  const mat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    uniforms: {
      uSeed: { value: seed },
      uTint: { value: new THREE.Color(tint) },
      uRim: { value: rimStrength },
    },
    vertexShader: /* glsl */`
      varying vec2 vUv;
      void main(){
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      uniform float uSeed;
      uniform vec3 uTint;
      uniform float uRim;

      float hash21(vec2 p){
        p = fract(p * vec2(123.34, 456.21));
        p += dot(p, p + 45.32);
        return fract(p.x * p.y);
      }
      float vnoise(vec2 p){
        vec2 i = floor(p), f = fract(p);
        f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x),
                   mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), f.x), f.y);
      }
      float fbm(vec2 p){
        float s = 0.0, a = 0.5;
        for(int i = 0; i < 5; i++){ s += a * vnoise(p); p *= 2.05; a *= 0.5; }
        return s;
      }

      void main(){
        float x = vUv.x * 3.4 + uSeed * 7.0;
        float ridge = 0.16
                    + 0.30 * fbm(vec2(x, uSeed))
                    + 0.10 * fbm(vec2(x * 3.1, uSeed * 2.0))
                    + 0.05 * fbm(vec2(x * 7.0, uSeed * 3.5));
        ridge = pow(ridge, 1.25);

        if(vUv.y > ridge) discard;

        float depth = clamp(1.0 - vUv.y / max(ridge, 0.001), 0.0, 1.0);
        vec3 col = uTint * (0.5 + 0.5 * depth);

        /* aurora rim on the crest */
        float rim = smoothstep(0.006, 0.0, ridge - vUv.y);
        col += vec3(0.16, 0.62, 0.44) * rim * uRim;

        /* snow flecks catching the sky */
        float snow = smoothstep(0.55, 0.95, fbm(vUv * vec2(140.0, 60.0) + uSeed)) * depth;
        col += vec3(0.05, 0.13, 0.12) * snow * 0.8;

        gl_FragColor = vec4(col, 1.0);
      }
    `,
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(width, height), mat);
  m.position.set(0, height * 0.5 - 2.6, -dist);
  return m;
}
scene.add(mountainPlane(1500, 150, 620, 1.7, 0x050b12, 0.22));
scene.add(mountainPlane(1200, 120, 460, 4.3, 0x060d15, 0.14));

/* --------------------------------------------------------- aurora ribbons */
const NOISE = /* glsl */`
  float hash21(vec2 p){
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }
  float vnoise(vec2 p){
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x),
               mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), f.x), f.y);
  }
  float fbm(vec2 p){
    float s = 0.0, a = 0.5;
    for(int i = 0; i < 4; i++){ s += a * vnoise(p); p *= 2.03; a *= 0.5; }
    return s;
  }
`;

function curtainMaterial(seed, opacity) {
  return new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    uniforms: {
      uTime: { value: 0 },
      uWind: { value: 0.6 },
      uStorm: { value: 0.6 },
      uSeed: { value: seed },
      uOpacity: { value: opacity },
      uMirror: { value: 0 },
    },
    vertexShader: /* glsl */`
      uniform float uTime;
      uniform float uWind;
      uniform float uSeed;
      uniform float uMirror;
      varying vec2 vUv;
      varying float vFold;

      void main(){
        vUv = uv;
        vec3 pos = position;
        float t = uTime * (0.35 + uWind * 0.65);
        float h = uv.y;

        float sway = sin(h * 5.0 + t * 0.8 + uSeed * 3.1) * 2.2
                   + sin(h * 2.1 - t * 0.5 + uSeed * 1.3) * 3.8
                   + sin(pos.x * 0.055 + t * 0.42 + uSeed * 2.0) * 2.6;

        pos.x += sway * (0.2 + h * 0.8) * (0.45 + uWind * 0.9);
        pos.z += cos(h * 3.4 + t * 0.62 + uSeed * 2.2) * 2.4 * (0.4 + uWind);
        pos.z += sin(pos.x * 0.02 + t * 0.18) * 5.0;
        pos.x += uMirror * sin(pos.y * 0.55 + t * 1.1 + uSeed) * 0.9;

        vFold = 0.5 + 0.5 * sin(pos.x * 0.03 + t * 0.3 + uSeed);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      varying vec2 vUv;
      varying float vFold;
      uniform float uTime;
      uniform float uWind;
      uniform float uStorm;
      uniform float uSeed;
      uniform float uOpacity;
      uniform float uMirror;

      ${NOISE}

      void main(){
        float h = vUv.y;
        float t = uTime;

        /* warm-to-cool vertical identity */
        float bottom = smoothstep(0.0, 0.14, h);
        float top    = smoothstep(1.0, 0.42, h);

        /* vertical rays, drifting sideways with the wind */
        float rayUv = vUv.x * 118.0 + uSeed * 13.0 + t * 0.10 * (0.4 + uWind);
        float rays = vnoise(vec2(rayUv, t * 0.20 + uSeed * 5.0));
        rays = 0.06 + 0.94 * pow(rays, 2.4);
        rays *= 0.55 + 0.45 * sin(vUv.x * 13.0 + t * 0.45 + uSeed);

        /* second, finer striation layer */
        float fine = vnoise(vec2(rayUv * 2.7 - t * 0.06, t * 0.15 + uSeed * 9.0));
        rays *= 0.72 + 0.5 * pow(fine, 1.4);

        /* bright lower hem where the curtain meets the atmosphere */
        float hem = exp(-h * 26.0) * 0.9 + exp(-h * 7.0) * 0.25;

        /* slow folded sheets */
        float folds = fbm(vec2(vUv.x * 4.5 + uSeed * 2.0, h * 2.4 - t * 0.20));
        folds = 0.45 + 0.55 * folds;

        /* colour: green base, cyan waist, violet crown */
        vec3 cGreen  = vec3(0.06, 1.00, 0.38);
        vec3 cCyan   = vec3(0.14, 0.86, 0.92);
        vec3 cViolet = vec3(0.62, 0.18, 1.00);
        vec3 cRose   = vec3(1.00, 0.34, 0.62);

        vec3 col = mix(cGreen, cCyan, smoothstep(0.02, 0.42, h));
        col = mix(col, cViolet, smoothstep(0.52, 1.0, h) * 0.8);
        col = mix(col, cRose, smoothstep(0.62, 0.35, uStorm) * smoothstep(0.15, 0.9, h) * 0.35);

        float edge = smoothstep(0.0, 0.05, h) * smoothstep(1.0, 0.62, h);
        float a = bottom * top * edge;
        a *= (rays + hem * 0.55) * folds;
        a *= (0.5 + 0.7 * vFold);
        a *= (0.55 + uWind * 0.6);
        a *= uOpacity * 1.35;

        /* reflections are wide and faint */
        a *= mix(1.0, 0.55, uMirror);

        vec3 outc = col * a * 1.5;
        gl_FragColor = vec4(outc, a);
      }
    `,
  });
}

const curtains = [];
const curtainGroup = new THREE.Group();
const mirrorGroup = new THREE.Group();
scene.add(curtainGroup);
scene.add(mirrorGroup);

const CURTAIN_DEFS = [
  { x: -34, y: 8.0, z: -96, w: 120, h: 34, seed: 1.3, op: 0.55 },
  { x: 26, y: 10.0, z: -84, w: 110, h: 36, seed: 3.7, op: 0.62 },
  { x: -6, y: 6.5, z: -70, w: 120, h: 32, seed: 6.1, op: 0.78 },
  { x: 40, y: 12.0, z: -60, w: 90, h: 30, seed: 8.9, op: 0.5 },
  { x: -46, y: 9.0, z: -55, w: 86, h: 28, seed: 11.4, op: 0.42 },
];

for (const d of CURTAIN_DEFS) {
  const geo = new THREE.PlaneGeometry(d.w, d.h, 96, 40);
  const mat = curtainMaterial(d.seed, d.op);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(d.x, d.y + d.h * 0.5 - 2.0, d.z);
  curtainGroup.add(mesh);
  curtains.push(mat);

  const mmat = curtainMaterial(d.seed, d.op * 0.75);
  mmat.uniforms.uMirror.value = 1;
  const mirror = new THREE.Mesh(geo, mmat);
  mirror.scale.y = -1;
  mirror.position.set(d.x, -(d.y + d.h * 0.5 - 2.0), d.z);
  mirror.renderOrder = 3;
  mirrorGroup.add(mirror);
  curtains.push(mmat);
}

/* ---------------------------------------------------------------- water */
const waterMat = new THREE.ShaderMaterial({
  uniforms: { uTime: { value: 0 }, uStorm: { value: 0.6 } },
  vertexShader: /* glsl */`
    varying vec3 vWorld;
    void main(){
      vec4 wp = modelMatrix * vec4(position, 1.0);
      vWorld = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying vec3 vWorld;
    uniform float uTime;
    uniform float uStorm;

    float hash21(vec2 p){
      p = fract(p * vec2(123.34, 456.21));
      p += dot(p, p + 45.32);
      return fract(p.x * p.y);
    }
    float vnoise(vec2 p){
      vec2 i = floor(p), f = fract(p);
      f = f * f * (3.0 - 2.0 * f);
      return mix(mix(hash21(i), hash21(i + vec2(1, 0)), f.x),
                 mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), f.x), f.y);
    }
    float fbm(vec2 p){
      float s = 0.0, a = 0.5;
      for(int i = 0; i < 4; i++){ s += a * vnoise(p); p *= 2.03; a *= 0.5; }
      return s;
    }

    void main(){
      vec3 P = vWorld;
      float dist = length(P.xz);

      /* near-black ice sheet */
      vec3 col = vec3(0.006, 0.014, 0.020);

      /* broad wind-drifted snow cover */
      float drift = fbm(P.xz * 0.018 + vec2(0.0, uTime * 0.004));
      col += vec3(0.008, 0.028, 0.032) * smoothstep(0.35, 0.85, drift) * 0.8;

      /* fracture lines catching the aurora */
      float crack = abs(fbm(P.xz * 0.11 + 4.0) - 0.5);
      float crackGlow = smoothstep(0.035, 0.0, crack);
      float crackFade = smoothstep(1200.0, 120.0, dist);
      col += vec3(0.07, 0.24, 0.21) * crackGlow * 0.18 * crackFade;

      /* long horizontal ice ridges */
      float ridge = sin(P.z * 0.35 + uTime * 0.06 + sin(P.x * 0.05) * 2.2)
                  + sin(P.z * 0.13 - uTime * 0.03) * 0.7;
      col += vec3(0.045, 0.14, 0.13) * smoothstep(1.2, 2.0, ridge) * 0.22 * smoothstep(640.0, 60.0, dist);

      /* aurora light pooling on the ice, strongest near the horizon */
      float pool = exp(-max(abs(P.z) - 30.0, 0.0) * 0.0075);
      float poolDist = smoothstep(15.0, 240.0, dist) * smoothstep(1150.0, 420.0, dist);
      col += vec3(0.030, 0.125, 0.098) * pool * poolDist * (0.30 + uStorm * 0.55);

      /* very faint specular sheen streak */
      float sheen = pow(max(0.0, 1.0 - abs(P.x) / 260.0), 3.0) * exp(-max(abs(P.z), 1.0) * 0.004);
      col += vec3(0.06, 0.20, 0.17) * sheen * 0.12;

      /* melt into the night at the far edge */
      float far = smoothstep(260.0, 1150.0, dist);
      col = mix(col, vec3(0.012, 0.032, 0.034), far);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const water = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), waterMat);
water.rotation.x = -Math.PI / 2;
water.renderOrder = 1;
scene.add(water);

/* ----------------------------------------------------------------- snow */
const SNOW_N = 2600;
const snowGeo = new THREE.BufferGeometry();
const snowPos = new Float32Array(SNOW_N * 3);
const snowSeed = new Float32Array(SNOW_N);
for (let i = 0; i < SNOW_N; i++) {
  snowPos[i * 3] = (Math.random() - 0.5) * 120;
  snowPos[i * 3 + 1] = Math.random() * 50;
  snowPos[i * 3 + 2] = (Math.random() - 0.5) * 100 - 20;
  snowSeed[i] = Math.random();
}
snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
snowGeo.setAttribute('aSeed', new THREE.BufferAttribute(snowSeed, 1));

const snowMat = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: { uTime: { value: 0 }, uWind: { value: 0.6 } },
  vertexShader: /* glsl */`
    attribute float aSeed;
    uniform float uTime;
    uniform float uWind;
    varying float vFade;
    void main(){
      vec3 p = position;
      float t = uTime * (0.4 + uWind * 0.7);
      p.y = mod(p.y - t * (2.0 + aSeed * 3.0), 50.0);
      p.x += sin(t * 0.7 + aSeed * 12.0) * 4.0 + uWind * 4.0;
      p.z += cos(t * 0.5 + aSeed * 9.0) * 3.0;

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = clamp((0.7 + aSeed * 1.7) * (150.0 / max(-mv.z, 1.0)), 0.6, 5.0);
      vFade = 0.18 + aSeed * 0.45;
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    varying float vFade;
    void main(){
      vec2 c = gl_PointCoord - 0.5;
      float d = length(c);
      if(d > 0.5) discard;
      float a = smoothstep(0.5, 0.0, d) * vFade;
      gl_FragColor = vec4(vec3(0.75, 0.92, 0.95), a * 0.5);
    }
  `,
});
const snow = new THREE.Points(snowGeo, snowMat);
snow.frustumCulled = false;
scene.add(snow);

/* ------------------------------------------------------------ post stack */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.55, 0.8, 0.45);
composer.addPass(bloom);
composer.addPass(new OutputPass());

const finalShader = {
  uniforms: {
    tDiffuse: { value: null },
    uTime: { value: 0 },
    uRes: { value: new THREE.Vector2(1, 1) },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float uTime;
    uniform vec2 uRes;
    varying vec2 vUv;
    float rand(vec2 c){ return fract(sin(dot(c, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec2 c = vUv - 0.5;
      vec2 off = c * 0.0012 * (0.4 + dot(c, c) * 2.0);
      vec3 col;
      col.r = texture2D(tDiffuse, vUv + off).r;
      col.g = texture2D(tDiffuse, vUv).g;
      col.b = texture2D(tDiffuse, vUv - off).b;
      col += (rand(vUv * uRes + fract(uTime)) - 0.5) * 0.026;
      float vig = smoothstep(1.25, 0.25, length(c) * 1.7);
      col *= vig;
      gl_FragColor = vec4(col, 1.0);
    }
  `,
};
const finalPass = new ShaderPass(finalShader);
composer.addPass(finalPass);

/* ---------------------------------------------------------------- sizing */
let dpr = Math.min(window.devicePixelRatio || 1, 2);
const buf = new THREE.Vector2();

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(dpr);
  composer.setPixelRatio(dpr);
  renderer.setSize(w, h, false);
  composer.setSize(w, h);
  renderer.getDrawingBufferSize(buf);
  finalPass.uniforms.uRes.value.copy(buf);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

/* --------------------------------------------------------------- pointer */
const pointer = { tx: 0, ty: 0, x: 0, y: 0 };
window.addEventListener('pointermove', (e) => {
  pointer.tx = (e.clientX / window.innerWidth - 0.5) * 2;
  pointer.ty = -(e.clientY / window.innerHeight - 0.5) * 2;
}, { passive: true });

/* ---------------------------------------------------------------- slider */
const windEl = $('wind');
const windValEl = $('wind-val');
const windReadEl = $('wind-read');
let wind = 0.6;

function applyWind(v) {
  wind = v / 100;
  windValEl.textContent = String(Math.round(v)).padStart(3, '0');
  windReadEl.textContent = Math.round(300 + wind * 620) + ' KM/S';
  const storm = 0.25 + wind * 0.9;
  for (const m of curtains) {
    m.uniforms.uWind.value = wind;
    m.uniforms.uStorm.value = storm;
  }
  waterMat.uniforms.uStorm.value = storm;
  skyMat.uniforms.uStorm.value = storm;
  snowMat.uniforms.uWind.value = wind;
  bloom.strength = 0.5 + wind * 0.42;
}
windEl.addEventListener('input', () => applyWind(Number(windEl.value)));
applyWind(Number(windEl.value));

/* ------------------------------------------------------------------ loop */
const clock = new THREE.Clock();
let elapsed = 0;
let fps = 60, frames = 0, acc = 0;

function tick() {
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;

  pointer.x += (pointer.tx - pointer.x) * Math.min(1, dt * 2.0);
  pointer.y += (pointer.ty - pointer.y) * Math.min(1, dt * 2.0);

  for (const m of curtains) m.uniforms.uTime.value = elapsed;
  waterMat.uniforms.uTime.value = elapsed;
  skyMat.uniforms.uTime.value = elapsed;
  snowMat.uniforms.uTime.value = elapsed;
  finalPass.uniforms.uTime.value = elapsed;

  camera.position.set(
    Math.sin(elapsed * 0.045) * 1.6 + pointer.x * 2.6,
    1.9 + pointer.y * 0.8 + Math.sin(elapsed * 0.07) * 0.22,
    16
  );
  camera.lookAt(pointer.x * 6.0, 9.4 + pointer.y * 3.0, -40);

  composer.render();

  frames++; acc += dt;
  if (acc >= 0.5) {
    fps = frames / acc;
    $('hud-fps').textContent = fps.toFixed(0);
    $('hud-fps').style.color = fps >= 45 ? '#9dffdc' : '#ff9d9d';
    frames = 0; acc = 0;
  }
}

function init() {
  resize();
  renderer.compile(scene, camera);
  composer.render();
  requestAnimationFrame(tick);
  window.setTimeout(() => loader.classList.add('hidden'), 700);
}
init();
</script>
</body>
</html>
